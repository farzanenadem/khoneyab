# docker compose up -d --build        -> UI on http://localhost:3000, API on :8000
# Needs ./model/multilingual-e5-base and a built index in ./data/index (see README), and .env for the LLM.
services:
  api:
    build: .
    image: jobyab-api:latest
    container_name: jobyab-api
    restart: unless-stopped
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - MONITORING_DB_PATH=/app/logs/requests.sqlite3
    ports:
      - 8000:8000
    volumes:
      - ./model:/app/model:ro    # embedding model
      - ./data:/app/data         # job index + live crawl files
      - ./logs:/app/logs         # monitoring ledger (token/speed history per request)
    depends_on:
      - qdrant                   # crawl cache (+ optional job groups)

  web:
    build: ./ui/web
    image: jobyab-web:latest
    container_name: jobyab-web
    restart: unless-stopped
    environment:
      - JOB_API_URL=http://api:8000
    ports:
      - 3000:3000
    depends_on:
      api:
        condition: service_healthy

  qdrant:
    # Caches live-crawled ads + embeddings (crawl_cache in configs/job_search.yaml); also used by job groups.
    # Web UI: http://localhost:6333/dashboard
    image: qdrant/qdrant:v1.15.4
    container_name: jobyab-qdrant
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - ./data/qdrant:/qdrant/storage   # persists the cache across restarts
