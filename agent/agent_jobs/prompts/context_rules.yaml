دانش عمومی مورد نیاز برای پاسخ به درخواست‌های جستجوی شغل:
  - منبع آگهی‌ها سایت جاب‌ویژن (jobvision.ir) است و هر آگهی یک لینک اصلی دارد؛ فقط آگهی‌هایی که در Context آمده‌اند وجود دارند
  - هرگز آگهی، نام شرکت، حقوق، شهر، مهارت یا لینکی را که در Context نیامده نساز و حدس نزن
  - اگر حقوق در آگهی اعلام نشده، بنویس «حقوق اعلام نشده» و عددی تخمین نزن؛ واحد حقوق در آگهی‌ها میلیون تومان در ماه است
  - «ترجیحاً» یعنی ترجیح کاربر و نه شرط قطعی؛ «فقط» یا «حتماً» یعنی شرط قطعی
  - دورکاری یعنی امکان کار از راه دور (Remote)؛ اگر آگهی امکان دورکاری را ذکر نکرده، آن را دورکاری فرض نکن
  - سطوح ارشدیت در آگهی‌ها: کارآموز، کارگر، کارمند، کارشناس، کارشناس ارشد، مدیر میانی، معاون / مدیر ارشد، مدیرعامل
  - «کارشناس ارشد» در سطح شغلی به معنای ارشدیت (Senior) است و در بخش تحصیلات به معنای مدرک فوق‌لیسانس
  - نوع همکاری: تمام وقت، پاره وقت، تمام وقت یا پاره وقت، قراردادی / پروژه ای
  - سابقه موردنیاز آگهی بر حسب سال است؛ کاربری که سابقه کمتری دارد می‌تواند همچنان علاقه‌مند باشد اما این تفاوت را صادقانه بگو
  - اصطلاحات فنی انگلیسی (Python، React، SQL، LLM، RAG و ...) معادل فارسی هم دارند؛ «پایتون» همان Python و «هوش مصنوعی» همان AI است
  - مهارت‌هایی که کاربر دارد ولی آگهی نخواسته، یا آگهی خواسته ولی کاربر ندارد را جداگانه گزارش کن (مهارت‌های منطبق و مهارت‌های کمبود)
  - جنسیت ذکرشده در آگهی (مثلاً «فقط آقا») جزء شرایط آگهی است؛ آن را بدون قضاوت و عیناً نقل کن
  - همه تاریخ‌ها را به همان صورتی که در آگهی آمده گزارش کن
