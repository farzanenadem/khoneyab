  detail: نام، شماره ملی و چهره را با سند و پاسخ ثبت تطبیق دهید. اختلاف یا امضای فرد دیگر بدون مدرک نمایندگی یعنی توقف امضا و ارجاع به دفترخانه. سن/حیات و محدودیت‌های متصل به سامانه را دفترخانه کنترل می‌کند؛ کارت ملی مالکیت را ثابت نمی‌کند.
