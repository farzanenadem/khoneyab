source: 'iran_property_due_diligence.md — تاریخ پژوهش: ۸ آبان ۱۴۰۵'
summary: خرید ایمن مستلزم احراز جداگانه مالکیت و اختیار انتقال، امکان تصرف و تحویل، مجاز بودن ساخت و کاربری و وضع فنی و بدهی‌ها است. سند مالکیت، پایان‌کار یا پاسخ یک سامانه به‌تنهایی همه این موارد را ثابت نمی‌کند. پیش از پرداخت عمده، دفترخانه باید وضعیت ثبتی و مسیر قانونی ثبت قرارداد را برای پلاک و فروشنده همان معامله بررسی کند.
repeat_note: وضعیت ثبتی، بازداشت و رهن، وکالت، شارژ/قبض، تصرف و تخلفات جدید می‌توانند بین توافق و انتقال تغییر کنند.
