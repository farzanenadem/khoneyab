  detail: قرارداد رسمی، مدارک قانونی اصلاح‌شده، طرح واحد، بیمه و پاسخ ثبت را در دفترخانه کنترل کنید. اقساط را به گزارش پیشرفت و شرایط تحویل گره بزنید. گزارش ناظر، نبود فروش معارض یا توان مالی سازنده را تضمین نمی‌کند. قانون پیش‌فروش، مواد ۲–۴ و ۱۲؛ اصلاحات قانون الزام، ماده ۱۵.
