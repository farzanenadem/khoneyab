misconceptions:
- belief: اصل سند را دیدم
  why: ممکن است اصیل ولی قدیمی، تعویض‌شده، در رهن یا بازداشت باشد.
- belief: کارت ملی فروشنده را دیدم
  why: هویت، مالکیت و اختیار فروش سه موضوع جدا هستند.
- belief: پایان‌کار دارد
  why: مالکیت، نبود ساخت بعدی و سلامت فعلی را ثابت نمی‌کند.
- belief: فروشنده گفت بدهی ندارد
  why: مبلغ و مرجع بدهی مدرک تاریخ‌دار می‌خواهد.
- belief: مبایعه‌نامه امضا شد
  why: شمول قانون الزام و ثبت معتبر برای همان ملک را باید سنجید.
- belief: استعلام آنلاین مثبت است
  why: باید دانست پاسخ فقط اصالت، وضعیت ثبت، امکان معامله، مالیات یا شهرسازی را پوشش می‌دهد.
special_cases:
- title: ارثی
  text: وراثت، سهم همه، تقسیم‌نامه، امضای همه/وکیل معتبر، مجوز محجور و مالیات بر ارث.
- title: وکالتی
  text: اصالت و بقای وکالت درست پیش از سند؛ اختیار صریح دریافت ثمن.
- title: در حال ساخت
  text: مالک زمین، پروانه، مشارکت، سهم سازنده، تفکیک آینده و هزینه تکمیل.
- title: پیش‌فروش
  text: سند رسمی، مشخصات قابل تعیین، مدارک قانون اصلاح‌شده، پیشرفت و اقساط مرحله‌ای.
- title: در رهن
  text: نامه روز بانک، تسویه مستقیم توافق‌شده، فک رهن ثبت‌شده و زمان‌بندی هم‌زمان.
- title: ثبت ناقص
  text: پرونده ثبت و امکان سند حدنگار؛ ثبت ادعا سند یا تأیید حق نیست.
- title: با مستأجر
  text: اجاره، ودیعه، موعد تخلیه و تخصیص مسئولیت.
- title: وقفی
  text: حق دقیق خرید، اجاره عرصه، شرایط متولی و بدهی مربوط.
- title: چند مالک
  text: اختیار همه؛ سهم مشاع را واحد مفروز ندانید.
- title: تخلف شهری
  text: رأی نهایی، هزینه، امکان پایان‌کار/تفکیک و مسئول اصلاح.
- title: شرکت/تعاونی
  text: امضای مجاز، مصوبه، تخصیص قطعی واحد و محدودیت انتقال.
- title: روستایی/کشاورزی
  text: طرح هادی، نوعیت زمین، مجوز ساخت و تغییر کاربری با UTM یکسان.
open_questions:
- تاریخ صدور سند حدنگار و شمول ماده ۱ یا تبصره ۴ برای همین پلاک چیست؟ آیا پس از اعلان ۱۴۰۵/۰۲/۲۹ اعلان تازه‌ای آمده؟
- پاسخ ثبتی روز، همه سهام، بازداشت‌ها، رهن‌ها و حقوق ثبت‌شده همین واحد را پوشش می‌دهد؟
- برای وکالت، ارث، قیمومت یا شرکت در این انتقال چه مجوز تکمیلی لازم است؟
- مرجع شهرسازی آخرین ساخت و تغییرات را دیده و رأی تخلف اجرا نشده وجود دارد؟
- رقم قطعی مالیات، عوارض، فک رهن، بدهی وقف، شارژ و ودیعه مستأجر چیست و چه کسی می‌پردازد؟
- در پیش‌فروش یا فقدان سند مستقل، واحد و اختیار فروشنده از مسیر رسمی قابل ثبت و انتقال نهایی است؟
- برای زمین روستایی/خارج شهر، کدام مرجع صلاحیت نوعیت، طرح هادی، حریم و تغییر کاربری همان مختصات را دارد؟
