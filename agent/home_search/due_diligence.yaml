  detail: پلاک، واحد، متراژ مبنا، پارکینگ، قیمت، هزینه‌ها، دفترخانه، تاریخ سند، تحویل خالی، فک رهن، رفع تخلف، حق فسخ و خسارت را دقیق ثبت کنید. پرداخت عمده را به تحقق مستند شرط‌ها و انتقال رسمی متصل کنید. پول به حساب شخص بی‌سمت نرود؛ رسید بانکی بابت معامله و گیرنده را نشان دهد. وجه التزام جای رفع مانع انتقال را نمی‌گیرد.
