- id: transaction-possible
  n: 4
  title: «امکان انجام معامله»
  phase: agreement
  level: critical
  condition: null
  goal: کشف مانع سامانه‌ای
  reveals: کنترل تجمیعی هویت، حیات، سند و محدودیت متصل
