  docs: سند زمین، قرارداد
  when: پیش از وجه
  required: مشروط
  risk: فروش تکراری
  notes: مشارکت به‌خودی‌خود اختیار فروش هر واحد نیست.
  detail: قرارداد مشارکت، مالک رسمی زمین، تقسیم‌نامه و تخصیص دقیق واحد به سازنده را بررسی کنید؛ اختیار فروش سازنده را از متن و ثبت بخوانید. مشارکت به‌خودی‌خود حق فروش هر واحد نیست.
  sources:
