  detail: اصل سند، مشخصات امنیتی، شناسه و سابقه تعویض را به دفترخانه بدهید؛ تصدیق احتمالی آنلاین فقط اصالت سند ارائه‌شده را می‌سنجد. سند واقعی ممکن است پس از صدور منتقل، بازداشت یا منسوخ شده باشد. نبود اصل یا اختلاف شماره را با ثبت محل حل کنید.
