<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خونه‌یاب — معرفی محصول</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f8fc; color: #161a2b; font: 18px/2 Tahoma, sans-serif; }
    main { width: min(760px, calc(100% - 40px)); padding: 48px; border: 1px solid #e9ebf2; border-radius: 24px; background: #fff; box-shadow: 0 16px 48px #4f46e51a; }
    h1 { margin-top: 0; color: #4f46e5; } li { margin: 8px 0; } a { color: #4f46e5; }
  </style>
</head>
<body>
  <main>
    <h1>خونه‌یاب</h1>
    <p>دستیار خرید خانه برای پیدا کردن آگهی، سنجیدن بودجه و پیگیری استعلام‌های مهم پیش از خرید.</p>
    <ul>
      <li>جست‌وجوی فارسی روی آگهی‌های واقعی دیوار</li>
      <li>برآورد قسط و شکاف بودجه با توضیح محدودیت‌ها</li>
      <li>نقشه راه استعلام‌های حقوقی و فنی تا روز سند</li>
    </ul>
    <p><a href="http://localhost:3000">اجرای رابط خونه‌یاب</a></p>
  </main>
</body>
</html>
