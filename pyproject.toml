[project]
name = "job-search-agent"
version = "1.0.0"
description = "Descriptive Persian job search over JobVision ads"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix>=13.0.3",
    "fastapi>=0.128.0",
    "langchain>=1.2.7",
    "langchain-huggingface>=1.2.0",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.7",
    "numpy>=2.0",
    "openinference-instrumentation-langchain>=0.1.59",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "sentence-transformers>=5.2.2",
    "torch>=2.9.1",
    "transformers==4.57.3",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
# Only needed to build/use the optional job groups (configs/job_search.yaml -> job_groups).
job-groups = [
    "pyarrow>=18.0",
    "qdrant-client>=1.12",
    "scikit-learn>=1.5",
]

[[tool.uv.index]]
name = "internal"
url = "http://172.31.65.221:8081/repository/pypi/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
# Unit tests for the job search; the legacy Tests/*.py scripts need Ollama/Elasticsearch/MongoDB.
testpaths = ["Tests/job_search"]
pythonpath = ["."]
