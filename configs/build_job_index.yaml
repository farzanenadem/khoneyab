args:
  --jobs:
    default: ./rfp/jobs.jsonl
    help: JobVision listing export (one JSON job per line)

  --live-jobs:
    default: ./data/live/jobs.jsonl
    help: Ads collected by the live crawl during searches (merged if present)

  --other-jobs:
    default: ./data/live/other_sources.jsonl
    help: Normalized ads from Jobinja / IranTalent collected by the live crawl

  --details-dir:
    default: ./data/jobvision/details
    help: Cached detail pages from enrich_jobs_cli (optional; missing jobs are indexed without description)

  --config:
    default: ./configs/job_search.yaml
    help: Job search config (embedding model, index directory)

  --device:
    default: ""
    help: Override embedding device for the build (cpu / cuda); empty = use config
